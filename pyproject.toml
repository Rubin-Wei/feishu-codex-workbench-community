[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "feishu-codex-workbench"
version = "0.2.0"
description = "Private Feishu mobile workbench for Codex across SSH clusters"
requires-python = ">=3.11"
dependencies = ["httpx==0.28.1", "lark-oapi==1.7.5", "python-dotenv==1.2.4", "wsproto==1.3.2"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2"]

[project.scripts]
feishu-codex = "feishu_codex_workbench.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
